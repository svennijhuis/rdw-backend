[workspace]
resolver = "2"
members = ["crates/rdw-client", "crates/rdw-core", "crates/rdw-api"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json"] }
tower-http = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
csv = "1.4.0"
zip = "8.6.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
rand = "0.8"
thiserror = "1"
dashmap = "6"
url = "2"
